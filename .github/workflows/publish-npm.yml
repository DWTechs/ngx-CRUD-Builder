name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to check the tag is on main

      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./projects/ngx-crud-builder/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != v${VERSION} (projects/ngx-crud-builder/package.json)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome check)
        run: npm run lint

      - name: Run library tests
        run: npm run test

      - name: Build library
        run: npm run build:lib

      - name: Copy LICENSE into package
        run: cp LICENSE dist/ngx-crud-builder/

      - name: Verify package contents (dry run)
        working-directory: dist/ngx-crud-builder
        run: |
          npm publish --dry-run --access public
          npm pack --dry-run --json | node ../../.github/scripts/check-package-files.mjs

      - name: Publish package to npm
        working-directory: dist/ngx-crud-builder
        run: npm publish --access public --provenance
