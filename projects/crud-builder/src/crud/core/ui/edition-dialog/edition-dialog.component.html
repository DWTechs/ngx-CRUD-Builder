<p-dialog
  [visible]="isVisible()"
  [style]="{width: calculatedWidth(), height: height()}"
  [header]="dialogTitle()"
  [modal]="true"
  [maximizable]="true"
  styleClass="p-fluid"
  (visibleChange)="$event ? false : onHide()"
  (onHide)="onHide()"
  appendTo="body">

  <ng-template pTemplate="content">
    <div class="content-container">
      <frm-form
        [config]="config()"
        [model]="editedEntry()"
        [groupValidator]="groupValidator()"
        [isReadonly]="isReadonly() || !(functionalityKey() | hasAccess:2)"
        [forceReload]="forceReloadTime()"
        [columnsCount]="formColumnsCount()"
        [labelStrategy]="labelStrategy()"
        [labelStrategyVariant]="labelStrategyVariant()"
        (modelChange)="onFormChanged($event)"
        (validityChange)="onValidityChange($event)"
      />

      @if (features().getHistory) {
        @let historyData = history$ | async;
        @if (historyData) {
          <p-card>
            <ng-template #header>
              <span i18n="@@EditionDialog_HistoryCardHeader">
                Historique des modifications ({{ historyData.total }})
              </span>
            </ng-template>
            <shared-history
              [data]="historyData"
              [config]="config()"
              (selected)="onHistorySelect($event)"
            />
          </p-card>
        }
      }
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <div class="dialog-actions-container">
      <div class="left-actions">
        <crd-crud-button
          type="cancel"
          [label]="closeButtonLabel()"
          icon="pi pi-times"
          [disabled]="isLoading()"
          (click)="onHide()"
        />
        @if (isArchiveBtnDisplayed()) {
          <crd-crud-button
            type="delete"
            i18n-label="@@EditionDialog_ArchiveButton"
            label="Archiver"
            icon="pi pi-trash"
            [functionalityKey]="functionalityKey()"
            [disabled]="isLoading()"
            (click)="onArchive()"
          />
        }
        @if (isRestoreBtnDisplayed()) {
          <crd-crud-button
            type="restore"
            icon="pi pi-bolt"
            [functionalityKey]="functionalityKey()"
            [disabled]="isLoading()"
            (click)="onRestore()"
          />
        }
      </div>

      <div class="right-actions">
        @if (canInteract()) {
          <crd-crud-button
            type="validate"
            icon="pi pi-check"
            [protectFeature]="functionalityKey()"
            [minimalOperation]="2"
            [disabled]="isLoading() || invalidForm"
            (click)="onSave()"
          />
        }
      </div>

    </div>
  </ng-template>
</p-dialog>
