<p-dialog [visible]="visible()"
  [style]="{width: '450px'}"
  [header]="labels.exportDialog.header"
  [modal]="true"
  styleClass="p-fluid"
  (visibleChange)="$event ? false : onHide()"
  (onHide)="onHide()">
  <ng-template pTemplate="content">
    <div class="container">
      <span class="label">{{ labels.exportDialog.chooseFormat }}</span>
      <p-selectButton
        [options]="formats()"
        [(ngModel)]="format"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="container">
      <span class="label">{{ labels.exportDialog.chooseData }}</span>
      <p-selectButton
        [options]="selectionOptions"
        [(ngModel)]="selection"
        optionLabel="label"
        optionValue="value"
      />
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton
      pRipple
      [label]="labels.exportDialog.cancel"
      icon="pi pi-times"
      class="p-button-text"
      (click)="onHide()">
    </button>

    <button pButton
      pRipple
      [label]="labels.exportDialog.export"
      icon="pi pi-check"
      class="p-button-success"
      [loading]="isLoading()"      
      (click)="onExport()">
    </button>
  </ng-template>
</p-dialog>
