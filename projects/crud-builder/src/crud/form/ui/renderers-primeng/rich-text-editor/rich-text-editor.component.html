  <p-editor
    [formControl]="control()"
    [modules]="modules"
    class="editor-wysiwyg"
    [class.p-disabled]="isDisabled()"
    #editorComponent
    [style]="{ height: options().textEditorHeight || '200px' }">
    <ng-template pTemplate="header">
      <ng-container
        [ngTemplateOutlet]="toolbar"
        [ngTemplateOutletContext]="{ displayHtmlToggle: options().isHtmlToggleable}">
      </ng-container>
    </ng-template>
  </p-editor>
  <textarea #htmlEditor class="html-editor" [class.displayed]="htmlToggled"></textarea>
  @if (htmlToggled) {
    <button pButton
      pRipple
      type="button"
      icon="pi pi-times"
      class="p-button-rounded p-button-info close-html"
      (click)="toggleHTML()">
    </button>
  }

<ng-template #toolbar let-displayHtmlToggle="displayHtmlToggle">
  <p-header>
    <span class="ql-formats" style="margin-right: 0">
      <select class="ql-size"></select>
    </span>
    <span class="ql-formats">
      <button class="ql-bold"></button>
      <button class="ql-italic"></button>
      <button class="ql-underline"></button>
      <button class="ql-strike"></button>
    </span>
    <span class="ql-formats">
      <select class="ql-color"></select>
      <select class="ql-background"></select>
    </span>
    <!-- <span class="ql-formats">
    <button class="ql-script" value="sub"></button>

  </span>
  <span class="ql-formats">

    <button class="ql-header" value="2"></button>

  </span> -->
  <span class="ql-formats" style="margin-right: 0">
    <button class="ql-list" value="ordered"></button>
    <button class="ql-list" value="bullet"></button>
    <!-- <button class="ql-indent" value="-1"></button>
    <button class="ql-indent" value="+1"></button> -->
  </span>

  <button class="ql-direction" value="rtl"></button>

</span>

<span class="ql-formats" style="margin-right: 0">

  @if (displayHtmlToggle) {
    <button pButton
      pRipple
      type="button"
      icon="pi pi-code"
      class="p-button-rounded p-button-text html-toggler"
      (click)="toggleHTML()"
      [title]="labels.richTextEditor.editHtml">
