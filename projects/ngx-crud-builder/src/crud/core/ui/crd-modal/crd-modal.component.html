@if (open()) {
  <div class="crd-modal-backdrop" (click)="onBackdropClick($event)">
    <div
      class="crd-modal-panel"
      [class]="panelClass()"
      [style]="panelStyle()"
      cdkDrag
      [cdkDragDisabled]="!draggable()"
      cdkDragBoundary=".crd-modal-backdrop"
      role="dialog"
      aria-modal="true"
      cdkTrapFocus
      cdkTrapFocusAutoCapture>
      <ng-content />
    </div>
  </div>
}
