@if (mode() === "spinner") {
  <svg class="crd-spinner" viewBox="0 0 50 50">
    <circle class="crd-spinner-track" cx="25" cy="25" r="20" fill="none" />
    <circle class="crd-spinner-head" cx="25" cy="25" r="20" fill="none" />
  </svg>
} @else {
  <div class="crd-bar">
    <div class="crd-bar-indicator"></div>
  </div>
}
