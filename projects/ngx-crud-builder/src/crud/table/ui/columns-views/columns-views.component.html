<div class="view-header">
  <h3>{{ labels.columnsViews.title }}</h3>
  <p-button
    [label]="labels.columnsViews.add"
    icon="pi pi-plus"
    [disabled]="isNewFieldDisplayed"
    (click)="showNewViewField()"
  />
</div>

<div class="views-container-list">
  <p-listbox [options]="views()" 
    optionLabel="name" 
    optionValue="id" 
    [disabled]="isNewFieldDisplayed"
    [ngModel]="activeViewId()" 
    (onChange)="onSelectView($event.value)">
    <ng-template #item let-view>      
        <div class="flex-item">
            <div>
              {{ view.name }}
              @if (view.locked) {
                <i class="pi pi-lock" style="font-size: 0.75rem; margin-left: 0.35rem; opacity: 0.6;"></i>
              }
            </div>
            @if (!view.locked) {
              <div class="view-actions">
                <p-button
                    icon="pi pi-pencil"
                    [title]="labels.columnsViews.rename"
                    [text]="true"
                    (click)="startRenameView($event, view)"
                />
                <p-button
                    icon="pi pi-trash"
                    [title]="labels.columnsViews.delete"
                    [text]="true"
                    (click)="onDeleteView($event, view.id)"
                />
              </div>
            }
        </div>       
    </ng-template>
  </p-listbox>
    @if (renamingViewId() !== null) {
      <div class="new-view">
        <input #renameInput
          type="text"
          pInputText
          [ngModel]="renamingViewName()"
          (ngModelChange)="renamingViewName.set($event)"
          (keyup.enter)="submitRename(renamingViewId())"
          (keyup.escape)="cancelRename()"
        />
        <p-button
            icon="pi pi-check"
            [title]="labels.columnsViews.validate"
            [text]="true"
            (click)="submitRename(renamingViewId())"
        />
        <p-button
            icon="pi pi-times"
            [title]="labels.columnsViews.cancel"
            [text]="true"
            (click)="cancelRename()"
        />
      </div>
    }
    @if (isNewFieldDisplayed) {
      <div class="new-view">
        <input #name
          type="text"
          pInputText
          (keyup.enter)="submitNewView(name.value)"
          autofocus
        />
        <p-button
            class="validate-view-button"
            icon="pi pi-check"
            [title]="labels.columnsViews.validate"
            [text]="true"
            (click)="submitNewView(name.value)"
        />
        <p-button
            class="delete-view-button"
            icon="pi pi-times"
            [title]="labels.columnsViews.cancel"
            [text]="true"
            (click)="hideNewViewField()"
        />
      </div>
    }
  </div>
