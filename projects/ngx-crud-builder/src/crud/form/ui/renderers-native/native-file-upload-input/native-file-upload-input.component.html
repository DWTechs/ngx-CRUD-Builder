<input #fileInput
  [id]="'file-upload-' + config().key"
  type="file"
  [accept]="accept()"
  [multiple]="options().multiple"
  [disabled]="isDisabled()"
  (change)="onFileUploaded(fileInput)"
/>

<label
  [for]="'file-upload-' + config().key"
  class="upload-zone"
  [class.disabled]="isDisabled()"
  [class.dragged-over]="isDraggedOver"
  (drop)="onDrop($event, fileInput)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (dragenter)="prevent($event)">

  @if (options().multiple) {
  <div class="dropbox-toolbar">
    <div class="toolbar-left">
      <button
        type="button"
        class="tool-btn"
        [title]="labels.fileUpload.chooseFile"
        [disabled]="!canAddMore()"
        (click)="fileInput.click()"
      >⬆</button>
      <button
        type="button"
        class="tool-btn danger"
        title="Tout supprimer"
        [disabled]="!localFiles() || localFiles().length === 0"
        (click)="clearAll(fileInput)"
      >✕</button>
    </div>
    <div class="toolbar-right">
      <button
        type="button"
        class="tool-btn info"
        [title]="infoTitle()"
      >ℹ</button>
    </div>
  </div>
  }

  <div class="dropbox-container">
    @let hasFiles = localFiles() && localFiles().length > 0;
    @if (!hasFiles) {
      <span class="upload-icon">⬆</span>
      <p>{{ labels.fileUpload.dragDropLabel }}</p>
      @if (!options().multiple && constraintsHint(); as hint) {
        <small class="constraints-hint">{{ hint }}</small>
      }
    } @else {
      <div class="uploaded-files-container">
        @if (options().multiple) {
          <div class="container-title">
            {{ labels.fileUpload.uploadedFilesTitle }}
          </div>
        }
        @for (file of localFiles(); track file; let i = $index) {
          <div class="file-row">
            @if (!options().multiple) {
              <button
                type="button"
                class="file-btn"
                [title]="labels.fileUpload.chooseFile"
                (click)="fileInput.click()"
              >↻</button>
            }
            <button
              type="button"
              class="file-btn danger"
              title="Supprimer"
              (click)="clear(i, fileInput)"
            >✕</button>
            <button
              type="button"
              class="file-btn"
              title="Télécharger"
              (click)="onDownload(file)"
            >⬇</button>
            @if (canPreview(file)) {
              <button
                type="button"
                class="file-thumbnail"
                [title]="labels.fileUpload.preview"
                (click)="openPreview(file, previewDialog)"
              >
                <img [src]="file.src" [alt]="file | fileName" />
              </button>
            }
            <span class="file-name">{{ file | fileName }}</span>
            @if (file.sizeLabel; as size) {
              <span class="file-size">{{ size }}</span>
            }
          </div>
        }
      </div>
    }
  </div>
</label>

<dialog
  #previewDialog
  class="preview-dialog"
  (click)="previewDialog.close()"
  (close)="previewedFile.set(null)"
>
  @if (previewedFile(); as file) {
    <img class="preview-image" [src]="file.src" [alt]="file | fileName" />
  }
</dialog>
