<p-multiSelect
    [id]="config().key.toString()"
    [options]="selectOptions()"
    [formControl]="control()"
    [placeholder]="placeholder()"
    filterPlaceHolder="---"
    appendTo="body"        
    display="chip"
    [maxSelectedLabels]="options().maxSelectedLabels ?? 5"
    [filter]="options().areOptionsFilterable ?? true"
    [showToggleAll]="options().isSelectAllEnabled ?? true"
    [showClear]="showClear() && !isRequired()"
    (onChange)="emitInteractionEvent('valueChange')"
    (onClear)="emitInteractionEvent('clear')"
    (onFocus)="emitInteractionEvent('focus')"
    (onBlur)="emitInteractionEvent('blur')"
    (onPanelShow)="emitInteractionEvent('panelOpen')"
    (onPanelHide)="emitInteractionEvent('panelClose')">

  <ng-template #selecteditems let-selectedOptions let-removeChip="removeChip">
    @for (item of selectedOptions; track item) {
      @let option = item | multiSelectOption:selectOptions();
      <p-chip 
        [label]="option.label" 
        [removable]="true"
        (onRemove)="removeChip(item, $event)"
        class="{{ option.styleClass }} + basic-colored-chip"
        [style]="option.color ? {'background-color': option.color} : null"
      />
    }
  </ng-template>

</p-multiSelect>
