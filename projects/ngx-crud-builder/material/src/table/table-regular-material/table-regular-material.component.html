<div class="tbl-material-wrapper">
  <table
    mat-table
    matSort
    class="tbl-material-table"
    [dataSource]="pagedData()"
    [matSortActive]="sortState().field"
    [matSortDirection]="sortDirection()"
    (matSortChange)="onSortChange($event)">
    @if (selectable()) {
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox
            [checked]="isAllSelected()"
            [indeterminate]="isSomeSelected()"
            (change)="toggleAll($event.checked)" />
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox
            [checked]="isSelected(row)"
            (click)="$event.stopPropagation()"
            (change)="toggleRow(row)" />
        </td>
      </ng-container>
    }

    @for (col of visibleColumns(); track trackCol(col)) {
      <ng-container [matColumnDef]="col.key">
        <th
          mat-header-cell
          mat-sort-header
          *matHeaderCellDef
          [disabled]="!isColSortable(col)">{{ col.label }}</th>
        <td
          mat-cell
          *matCellDef="let row"
          [class.clickable]="clickableRows()"
          (click)="onCellClick(row, col)">
          <tbl-table-cell [cellValue]="row[col.key]" [options]="col" />
        </td>
      </ng-container>
    }

    @if (showActionsColumn()) {
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column"></th>
        <td mat-cell *matCellDef="let row" class="actions-column">
          @let customTemplate = customActionsTemplate();
          @if (customTemplate) {
            <ng-container
              [ngTemplateOutlet]="customTemplate"
              [ngTemplateOutletContext]="{ $implicit: row }">
            </ng-container>
          } @else {
            <tbl-table-actions-cell-material
              [features]="features()"
              (editClicked)="onActionClick(row, 'write')"
              (deleteClicked)="archived.emit(row.id)"
            />
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()"
      [ngStyle]="resolvedRowStyles(row)"
    ></tr>

    <tr class="no-data-row" *matNoDataRow>
      <td [attr.colspan]="displayedColumns().length">{{ labels.tableControl.noData }}</td>
    </tr>
  </table>

  @if (paginator()) {
    <mat-paginator
      [length]="total()"
      [pageSize]="rows()"
      [pageSizeOptions]="rowsPerPageOptions()"
      [pageIndex]="pageIndex()"
      (page)="onPage($event)"
    />
  }
</div>
